<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>아침 브리핑 데스크</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FFFFFF;
    --card:#F6F4EE;
    --card-hover:#EDE9DE;
    --paper:#1A1A1A;
    --muted:#6B6976;
    --hairline:#E1DDD1;
    --hr-accent:#1F8E82;
    --biz-accent:#B9691E;
    --ai-accent:#6A4FD1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Serif KR', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  .wrap{ max-width:720px; margin:0 auto; padding:24px 18px 80px; }

  header{
    display:flex; justify-content:space-between; align-items:flex-start;
    padding-bottom:20px; margin-bottom:24px; border-bottom:1px solid var(--hairline);
  }
  .title-block h1{ font-size:22px; margin:0 0 6px; font-weight:900; letter-spacing:-0.01em; }
  .date-line{ font-size:12px; color:var(--muted); letter-spacing:0.02em; }
  button{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.03em;
    background:var(--card); color:var(--paper);
    border:1px solid var(--hairline); border-radius:6px;
    padding:8px 12px; cursor:pointer;
  }
  button:hover{ background:var(--card-hover); }
  button:disabled{ opacity:0.5; cursor:default; }

  .desk{ background:var(--card); border-radius:10px; margin-bottom:18px; border-left:4px solid var(--muted); overflow:hidden; }
  .desk[data-tone="hr"]{ border-left-color:var(--hr-accent); }
  .desk[data-tone="biz"]{ border-left-color:var(--biz-accent); }
  .desk[data-tone="ai"]{ border-left-color:var(--ai-accent); }

  .desk-tag{
    display:inline-block; font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 8px; border-radius:4px; margin:16px 0 4px 18px;
  }
  .desk[data-tone="hr"] .desk-tag{ background:rgba(31,142,130,0.12); color:var(--hr-accent); }
  .desk[data-tone="biz"] .desk-tag{ background:rgba(185,105,30,0.12); color:var(--biz-accent); }
  .desk[data-tone="ai"] .desk-tag{ background:rgba(106,79,209,0.12); color:var(--ai-accent); }

  .item{ padding:14px 18px; border-top:1px solid var(--hairline); }
  .item:first-of-type{ border-top:none; }
  .item h3{ font-size:16px; margin:0 0 6px; font-weight:700; line-height:1.4; }
  .item h3 a{ color:var(--paper); text-decoration:none; }
  .item h3 a:hover{ text-decoration:underline; }
  .item p{ font-size:13.5px; line-height:1.65; color:#3A3A3A; margin:0 0 8px; }
  .item .source{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted); }
  .item .hr-comment{
    margin-top:8px; padding:8px 10px; background:rgba(0,0,0,0.035);
    border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:11px;
    color:var(--paper); border-left:2px solid var(--muted);
  }
  .empty-note{ padding:16px 18px; font-size:13px; color:var(--muted); font-style:italic; }

  .state-box{ text-align:center; padding:60px 20px; color:var(--muted); }
  .spinner{
    width:20px; height:20px; margin:0 auto 14px;
    border:2px solid var(--hairline); border-top-color:var(--paper);
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .archive{ margin-top:32px; }
  .archive-head{
    display:flex; justify-content:space-between; align-items:center;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.05em;
    color:var(--muted); text-transform:uppercase; margin-bottom:10px;
    cursor:pointer; user-select:none;
  }
  .archive-list{ display:flex; flex-direction:column; gap:2px; }
  .archive-list.collapsed{ display:none; }
  .archive-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 12px; border-radius:6px; cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted);
  }
  .archive-item:hover{ background:var(--card); color:var(--paper); }
  .archive-item.active{ background:var(--card); color:var(--paper); border:1px solid var(--hairline); }

  .error-box{
    background:var(--card); border:1px solid #E0B4B4; border-radius:8px;
    padding:16px; font-size:13px; color:#8B3A3A; line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>아침 브리핑 데스크</h1>
      <div class="date-line mono" id="dateLine">—</div>
    </div>
    <button id="refreshBtn">↻ 새로고침</button>
  </header>

  <div id="content">
    <div class="state-box"><div class="spinner"></div><div class="mono">불러오는 중...</div></div>
  </div>

  <div class="archive">
    <div class="archive-head" id="archiveToggle"><span>지난 브리핑</span><span id="archiveArrow">▾</span></div>
    <div class="archive-list" id="archiveList"></div>
  </div>
</div>

<script>
const CATEGORY_TONE = {
  "채용·HR·조직문화": "hr",
  "국내 대기업 사업동향": "biz",
  "AI·테크 전반": "ai"
};

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateLabel(dateStr){
  const days = ['일','월','화','수','목','금','토'];
  const d = new Date(dateStr + 'T00:00:00');
  return `${dateStr.replace(/-/g,'.')} ${days[d.getDay()]}요일`;
}
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(url){
  try{ const u = new URL(url); if(u.protocol === 'http:' || u.protocol === 'https:') return u.href; }catch(e){}
  return '#';
}

async function fetchBriefing(){
  // 같은 저장소(GitHub Pages) 안의 latest-briefing.json을 읽어옴.
  // ?t=timestamp는 브라우저/CDN이 옛날 버전을 캐싱해서 보여주는 걸 막기 위한 캐시 무효화 트릭.
  const url = `./latest-briefing.json?t=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok){
    throw new Error(`브리핑 파일을 가져오지 못했어요 (상태: ${res.status}). latest-briefing.json이 저장소에 있는지 확인해주세요.`);
  }
  return await res.json();
}

function renderBriefing(briefing){
  const content = document.getElementById('content');
  content.innerHTML = '';
  (briefing.categories || []).forEach(cat => {
    const tone = CATEGORY_TONE[cat.name] || 'hr';
    const desk = document.createElement('div');
    desk.className = 'desk';
    desk.setAttribute('data-tone', tone);

    const tag = document.createElement('div');
    tag.className = 'desk-tag';
    tag.textContent = cat.name;
    desk.appendChild(tag);

    if(!cat.items || cat.items.length === 0){
      const empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = '오늘은 특별한 소식 없음';
      desk.appendChild(empty);
    } else {
      cat.items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `
          <h3><a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.headline)}</a></h3>
          <p>${escapeHtml(item.summary)}</p>
          <div class="source">${escapeHtml(item.source || '')}</div>
          ${item.hrComment ? `<div class="hr-comment">HR 관점 · ${escapeHtml(item.hrComment)}</div>` : ''}
        `;
        desk.appendChild(el);
      });
    }
    content.appendChild(desk);
  });
}

function renderError(msg){
  document.getElementById('content').innerHTML = `
    <div class="error-box">
      ${escapeHtml(msg)}
      <div style="margin-top:10px;"><button id="retryBtn">다시 시도</button></div>
    </div>`;
  document.getElementById('retryBtn').onclick = () => loadToday(true);
}
function renderLoading(){
  document.getElementById('content').innerHTML = `<div class="state-box"><div class="spinner"></div><div class="mono">불러오는 중...</div></div>`;
}

async function loadToday(forceFetch){
  const dateStr = todayKey();
  document.getElementById('dateLine').textContent = formatDateLabel(dateStr);
  const refreshBtn = document.getElementById('refreshBtn');
  refreshBtn.disabled = true;
  renderLoading();

  try{
    const briefing = await fetchBriefing();
    localStorage.setItem(`brief:${briefing.date || dateStr}`, JSON.stringify(briefing));
    renderBriefing(briefing);
    refreshArchiveList();
    highlightArchive(briefing.date || dateStr);
  }catch(e){
    // 드라이브 요청 실패 시, 오늘 것이 로컬에 저장돼 있으면 그거라도 보여줌
    const cached = localStorage.getItem(`brief:${dateStr}`);
    if(cached && !forceFetch){
      renderBriefing(JSON.parse(cached));
      highlightArchive(dateStr);
    } else {
      renderError(e.message || String(e));
    }
  }
  refreshBtn.disabled = false;
}

function loadArchivedDate(dateStr){
  const cached = localStorage.getItem(`brief:${dateStr}`);
  if(cached){
    document.getElementById('dateLine').textContent = formatDateLabel(dateStr);
    renderBriefing(JSON.parse(cached));
    highlightArchive(dateStr);
  }
}

function highlightArchive(dateStr){
  document.querySelectorAll('.archive-item').forEach(el => {
    el.classList.toggle('active', el.dataset.date === dateStr);
  });
}

function refreshArchiveList(){
  const listEl = document.getElementById('archiveList');
  const keys = Object.keys(localStorage).filter(k => k.startsWith('brief:'));
  const dates = keys.map(k => k.replace('brief:', '')).sort((a,b) => b.localeCompare(a));
  listEl.innerHTML = '';
  if(dates.length === 0){
    listEl.innerHTML = `<div class="mono" style="font-size:11px; color:var(--muted); padding:8px 12px;">아직 쌓인 브리핑이 없어요.</div>`;
    return;
  }
  dates.forEach(dateStr => {
    const el = document.createElement('div');
    el.className = 'archive-item';
    el.dataset.date = dateStr;
    el.innerHTML = `<span>${formatDateLabel(dateStr)}</span><span>→</span>`;
    el.onclick = () => loadArchivedDate(dateStr);
    listEl.appendChild(el);
  });
}

document.getElementById('refreshBtn').onclick = () => loadToday(true);
document.getElementById('archiveToggle').onclick = () => {
  const list = document.getElementById('archiveList');
  const arrow = document.getElementById('archiveArrow');
  list.classList.toggle('collapsed');
  arrow.textContent = list.classList.contains('collapsed') ? '▸' : '▾';
};

refreshArchiveList();
loadToday(false);
</script>
</body>
</html>
