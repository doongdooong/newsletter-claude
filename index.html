<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="origin">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>뉴스레터</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FFFFFF;
    --card:#F6F4EE;
    --card-hover:#EDE9DE;
    --paper:#1A1A1A;
    --muted:#6B6976;
    --hairline:#E1DDD1;
    --hr-accent:#1F8E82;
    --biz-accent:#B9691E;
    --ai-accent:#6A4FD1;
    --star:#B8860B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Noto Serif KR', Georgia, serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }
  .wrap{ max-width:720px; margin:0 auto; padding:16px 18px 80px; }

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:16px; margin-bottom:20px; border-bottom:1px solid var(--hairline);
    gap:10px;
  }
  .title-block{ min-width:0; flex:1; text-align:center; }
  .title-block h1{ font-size:20px; margin:0 0 4px; font-weight:900; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .date-line{ font-size:12px; color:var(--muted); letter-spacing:0.02em; }

  .icon-btn{
    flex:0 0 auto; background:var(--card); color:var(--paper);
    border:1px solid var(--hairline); border-radius:8px;
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; line-height:1;
  }
  .icon-btn:hover{ background:var(--card-hover); }
  .icon-btn svg{ width:18px; height:18px; display:block; }

  .item{
    background:var(--card); border-radius:10px; border-left:4px solid var(--muted);
    padding:14px 16px; margin-bottom:12px;
  }
  .item[data-tone="hr"]{ border-left-color:var(--hr-accent); }
  .item[data-tone="biz"]{ border-left-color:var(--biz-accent); }
  .item[data-tone="ai"]{ border-left-color:var(--ai-accent); }

  .item-tag{
    display:inline-block; font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    padding:3px 8px; border-radius:4px; margin-bottom:8px;
  }
  .item[data-tone="hr"] .item-tag{ background:rgba(31,142,130,0.12); color:var(--hr-accent); }
  .item[data-tone="biz"] .item-tag{ background:rgba(185,105,30,0.12); color:var(--biz-accent); }
  .item[data-tone="ai"] .item-tag{ background:rgba(106,79,209,0.12); color:var(--ai-accent); }

  .item-head{ display:flex; align-items:flex-start; gap:8px; }
  .item h3{ font-size:16px; margin:0 0 6px; font-weight:700; line-height:1.4; flex:1; min-width:0; }
  .item h3 a{ color:var(--paper); text-decoration:none; }
  .item h3 a:hover{ text-decoration:underline; }
  .item p{ font-size:13.5px; line-height:1.65; color:#3A3A3A; margin:0 0 8px; }
  .item .source{ font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted); }
  .item .prev-link{ margin-top:6px; font-size:12px; color:var(--muted); }
  .item .prev-link a{ color:var(--muted); text-decoration:underline; text-decoration-color:var(--hairline); }
  .item .prev-link a:hover{ color:var(--paper); }
  .item .hr-comment{
    margin-top:8px; padding:8px 10px; background:rgba(0,0,0,0.035);
    border-radius:6px; font-family:'JetBrains Mono', monospace; font-size:11px;
    color:var(--paper); border-left:2px solid var(--muted);
  }
  .empty-note{ padding:16px 18px; font-size:13px; color:var(--muted); font-style:italic; }

  .star-btn{
    flex:0 0 auto; margin-top:1px; background:none; border:none; cursor:pointer;
    font-size:19px; line-height:1; color:var(--hairline); padding:2px;
  }
  .star-btn.starred{ color:var(--star); }

  .state-box{ text-align:center; padding:60px 20px; color:var(--muted); }
  .spinner{
    width:20px; height:20px; margin:0 auto 14px;
    border:2px solid var(--hairline); border-top-color:var(--paper);
    border-radius:50%; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .error-box{
    background:var(--card); border:1px solid #E0B4B4; border-radius:8px;
    padding:16px; font-size:13px; color:#8B3A3A; line-height:1.6;
  }
  .error-box button{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    background:var(--ink); color:var(--paper); border:1px solid var(--hairline);
    border-radius:6px; padding:8px 12px; cursor:pointer;
  }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.35); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed; top:0; left:0; height:100%; width:280px; max-width:82vw;
    background:var(--card); border-right:1px solid var(--hairline);
    transform:translateX(-100%); transition:transform .25s ease; z-index:50;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateX(0); }
  .drawer.drawer-right{
    left:auto; right:0; border-right:none; border-left:1px solid var(--hairline);
    transform:translateX(100%);
  }
  .drawer.drawer-right.open{ transform:translateX(0); }
  .drawer-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px; border-bottom:1px solid var(--hairline);
    font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted); flex:0 0 auto;
  }
  .drawer-close{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted); line-height:1; }
  .drawer-body{ flex:1; overflow-y:auto; padding:8px; }

  .date-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 12px; border-radius:6px; cursor:pointer;
    font-family:'JetBrains Mono', monospace; font-size:12.5px; color:var(--paper);
  }
  .date-item:hover{ background:var(--card-hover); }
  .date-item.active{ background:var(--card-hover); border:1px solid var(--hairline); }
  .date-item .weekday{ color:var(--muted); font-size:11px; }

  .drawer-empty{ padding:20px 14px; font-size:12.5px; color:var(--muted); }

  .bm-row{ position:relative; border-radius:8px; margin-bottom:6px; overflow:hidden; }
  .bm-delete-zone{
    position:absolute; top:0; bottom:0; left:0; width:64px; display:flex;
    align-items:center; justify-content:center; background:#C0392B;
  }
  .bm-delete-btn{ background:none; border:none; color:#fff; cursor:pointer; padding:10px; display:flex; }
  .bm-delete-btn svg{ width:19px; height:19px; }
  .bm-item{
    position:relative; padding:12px; border-radius:8px; background:var(--ink);
    border:1px solid var(--hairline); transform:translateX(0);
    transition:transform .2s ease; touch-action:pan-y; user-select:none;
  }
  .bm-item.dragging{ transition:none; }
  .bm-item .bm-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:6px; }
  .bm-item .bm-cat{
    font-family:'JetBrains Mono', monospace; font-size:9.5px; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--muted); margin-bottom:4px;
  }
  .bm-item h4{ font-size:13.5px; margin:0 0 4px; line-height:1.4; }
  .bm-item h4 a{ color:var(--paper); text-decoration:none; }
  .bm-item h4 a:hover{ text-decoration:underline; }
  .bm-item .bm-meta{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--muted); }
  .bm-hint{ padding:4px 4px 14px; font-size:11px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="icon-btn" id="sidebarBtn" aria-label="지난 브리핑">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
    </button>
    <div class="title-block">
      <h1>뉴스레터</h1>
      <div class="date-line mono" id="dateLine">—</div>
    </div>
    <button class="icon-btn" id="bookmarkBtn" aria-label="북마크 보관함">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16.2l-5-3.4-5 3.4V4Z"/></svg>
    </button>
  </div>

  <div id="content">
    <div class="state-box"><div class="spinner"></div><div class="mono">불러오는 중...</div></div>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<div class="drawer" id="sidebarDrawer">
  <div class="drawer-header">
    <span>지난 브리핑</span>
    <button class="drawer-close" id="sidebarClose">✕</button>
  </div>
  <div class="drawer-body" id="dateList"></div>
</div>

<div class="drawer drawer-right" id="bookmarkDrawer">
  <div class="drawer-header">
    <span>북마크 보관함</span>
    <button class="drawer-close" id="bookmarkClose">✕</button>
  </div>
  <div class="drawer-body" id="bookmarkList"></div>
</div>

<script>
const CATEGORY_TONE = {
  "채용·HR·조직문화": "hr",
  "국내 대기업 사업동향": "biz",
  "AI·테크 전반": "ai"
};
const CATEGORY_LABEL = {
  "채용·HR·조직문화": "HR",
  "국내 대기업 사업동향": "대기업",
  "AI·테크 전반": "AI·테크"
};

let archiveDates = [];   // ["2026-08-27", ...] ascending
let currentDate = null;
let currentBriefing = null;
let bookmarks = [];

function todayKey(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function formatDateLabel(dateStr){
  const days = ['일','월','화','수','목','금','토'];
  const d = new Date(dateStr + 'T00:00:00');
  return `${dateStr.replace(/-/g,'.')} ${days[d.getDay()]}요일`;
}
function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(url){
  try{ const u = new URL(url); if(u.protocol === 'http:' || u.protocol === 'https:') return u.href; }catch(e){}
  return '#';
}

// ---------- 데이터 로딩 ----------

async function fetchJson(path){
  const url = `${path}?t=${Date.now()}`;
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error(`파일을 가져오지 못했어요 (${path}, 상태: ${res.status})`);
  return await res.json();
}

async function loadArchiveIndex(){
  try{
    const list = await fetchJson('./archive/index.json');
    archiveDates = Array.isArray(list) ? list.slice().sort() : [];
  }catch(e){
    archiveDates = [];
  }
  renderDateList();
}

async function loadDate(dateStr){
  const content = document.getElementById('content');
  content.innerHTML = `<div class="state-box"><div class="spinner"></div><div class="mono">불러오는 중...</div></div>`;
  try{
    const briefing = await fetchJson(`./archive/${dateStr}.json`);
    currentDate = briefing.date || dateStr;
    currentBriefing = briefing;
    document.getElementById('dateLine').textContent = formatDateLabel(currentDate);
    renderBriefing(briefing);
    renderDateList();
  }catch(e){
    document.getElementById('dateLine').textContent = formatDateLabel(dateStr);
    renderError(e.message || String(e), dateStr);
  }
}

async function loadInitial(){
  await loadArchiveIndex();
  const today = todayKey();
  let target = archiveDates.includes(today) ? today : archiveDates[archiveDates.length - 1];
  if(!target){
    renderError('아직 저장된 브리핑이 없어요.', today);
    document.getElementById('dateLine').textContent = formatDateLabel(today);
    return;
  }
  await loadDate(target);
}

// ---------- 렌더링 ----------

function bookmarkId(dateStr, item){
  return `${dateStr}__${item.url || item.headline}`;
}
function isBookmarked(id){
  return bookmarks.some(b => b.id === id);
}

function renderBriefing(briefing){
  const content = document.getElementById('content');
  content.innerHTML = '';
  const dateStr = briefing.date || currentDate;
  let itemCount = 0;

  (briefing.categories || []).forEach(cat => {
    if(!cat.items || cat.items.length === 0) return;
    const tone = CATEGORY_TONE[cat.name] || 'hr';
    const label = CATEGORY_LABEL[cat.name] || cat.name;

    cat.items.forEach(item => {
      itemCount++;
      const id = bookmarkId(dateStr, item);
      const el = document.createElement('div');
      el.className = 'item';
      el.setAttribute('data-tone', tone);
      el.innerHTML = `
        <div class="item-tag">${escapeHtml(label)}</div>
        <div class="item-head">
          <h3><a href="${safeUrl(item.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.headline)}</a></h3>
          <button class="star-btn ${isBookmarked(id) ? 'starred' : ''}" data-id="${escapeHtml(id)}">${isBookmarked(id) ? '★' : '☆'}</button>
        </div>
        <p>${escapeHtml(item.summary)}</p>
        <div class="source">${escapeHtml(item.source || '')}</div>
        ${item.previousUrl && item.previousHeadline ? `<div class="prev-link">이전 기사 읽기: <a href="${safeUrl(item.previousUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.previousHeadline)}</a></div>` : ''}
        ${item.hrComment ? `<div class="hr-comment">HR 관점 · ${escapeHtml(item.hrComment)}</div>` : ''}
      `;
      el.querySelector('.star-btn').addEventListener('click', () => {
        toggleBookmark(id, dateStr, cat.name, item);
      });
      content.appendChild(el);
    });
  });

  if(itemCount === 0){
    content.innerHTML = `<div class="empty-note">이 날은 조건에 맞는 소식이 없었어요.</div>`;
  }
}

function renderError(msg, dateStr){
  document.getElementById('content').innerHTML = `
    <div class="error-box">
      ${escapeHtml(msg)}
      <div style="margin-top:10px;"><button id="retryBtn">다시 시도</button></div>
    </div>`;
  document.getElementById('retryBtn').onclick = () => loadDate(dateStr);
}

function renderDateList(){
  const listEl = document.getElementById('dateList');
  if(!archiveDates.length){
    listEl.innerHTML = `<div class="drawer-empty">아직 저장된 브리핑이 없어요.</div>`;
    return;
  }
  listEl.innerHTML = '';
  archiveDates.slice().reverse().forEach(dateStr => {
    const d = new Date(dateStr + 'T00:00:00');
    const days = ['일','월','화','수','목','금','토'];
    const el = document.createElement('div');
    el.className = 'date-item' + (dateStr === currentDate ? ' active' : '');
    el.innerHTML = `<span>${dateStr}</span><span class="weekday">${days[d.getDay()]}요일</span>`;
    el.onclick = () => { loadDate(dateStr); closeSidebar(); };
    listEl.appendChild(el);
  });
}

function renderBookmarkList(){
  openSwipeItem = null;
  const listEl = document.getElementById('bookmarkList');
  if(!bookmarks.length){
    listEl.innerHTML = `<div class="drawer-empty">아직 북마크한 뉴스가 없어요. 헤드라인 옆 별표를 눌러보세요.</div>`;
    return;
  }
  const sorted = bookmarks.slice().sort((a,b) => b.date.localeCompare(a.date) || b.savedAt - a.savedAt);
  listEl.innerHTML = `<div class="bm-hint">항목을 오른쪽으로 밀면 삭제할 수 있어요 →</div>`;
  sorted.forEach(b => {
    const row = document.createElement('div');
    row.className = 'bm-row';
    row.innerHTML = `
      <div class="bm-delete-zone"><button class="bm-delete-btn" aria-label="삭제">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16"/><path d="M9 7V4.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V7"/>
          <path d="M6 7l1 12.5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1L18 7"/><path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
      </button></div>
      <div class="bm-item">
        <div class="bm-top">
          <div style="min-width:0;">
            <div class="bm-cat">${escapeHtml(b.category)} · ${escapeHtml(b.date)}</div>
            <h4><a href="${safeUrl(b.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(b.headline)}</a></h4>
            <div class="bm-meta">${escapeHtml(b.source || '')}</div>
          </div>
        </div>
      </div>
    `;
    const itemEl = row.querySelector('.bm-item');
    const deleteBtn = row.querySelector('.bm-delete-btn');
    const removeThis = () => {
      bookmarks = bookmarks.filter(x => x.id !== b.id);
      saveBookmarks();
      renderBookmarkList();
      if(currentBriefing) renderBriefing(currentBriefing);
    };
    deleteBtn.addEventListener('click', removeThis);
    attachSwipeToDelete(itemEl);
    listEl.appendChild(row);
  });
}

// ---------- 북마크 스와이프 삭제 ----------

const REVEAL_WIDTH = 64;
let openSwipeItem = null;

function closeSwipeItem(el){
  if(!el) return;
  el.classList.remove('dragging');
  el.style.transform = 'translateX(0px)';
  el.dataset.open = '';
  if(openSwipeItem === el) openSwipeItem = null;
}

function attachSwipeToDelete(el){
  let startX = 0, startY = 0, dx = 0, dragging = false, decided = false, blockClick = false;

  el.addEventListener('pointerdown', (e) => {
    if(openSwipeItem && openSwipeItem !== el) closeSwipeItem(openSwipeItem);
    startX = e.clientX; startY = e.clientY; dx = 0; dragging = false; decided = false;
  });

  el.addEventListener('pointermove', (e) => {
    const curDx = e.clientX - startX;
    const curDy = e.clientY - startY;
    if(!decided){
      if(Math.abs(curDx) > 8 && Math.abs(curDx) > Math.abs(curDy) * 1.2){
        decided = true; dragging = true;
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);
      } else if(Math.abs(curDy) > 8){
        decided = true; dragging = false; // vertical scroll, let it pass
      }
    }
    if(dragging){
      e.preventDefault();
      const base = el.dataset.open === '1' ? REVEAL_WIDTH : 0;
      dx = Math.max(0, Math.min(REVEAL_WIDTH, base + curDx));
      el.style.transform = `translateX(${dx}px)`;
    }
  });

  const finish = (e) => {
    if(dragging){
      el.classList.remove('dragging');
      if(dx > REVEAL_WIDTH * 0.4){
        el.style.transform = `translateX(${REVEAL_WIDTH}px)`;
        el.dataset.open = '1';
        openSwipeItem = el;
        blockClick = true;
      } else {
        closeSwipeItem(el);
      }
    } else if(el.dataset.open === '1'){
      // 열려있는 상태에서 그냥 탭하면 닫기만 하고 링크 이동은 막음
      closeSwipeItem(el);
      blockClick = true;
    }
    dragging = false; decided = false;
  };
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);

  el.addEventListener('click', (e) => {
    if(blockClick){ e.preventDefault(); e.stopPropagation(); blockClick = false; }
  }, true);
}

// ---------- 북마크 저장 ----------

function loadBookmarks(){
  try{
    const raw = localStorage.getItem('briefing_bookmarks');
    bookmarks = raw ? JSON.parse(raw) : [];
  }catch(e){
    bookmarks = [];
  }
}
function saveBookmarks(){
  try{ localStorage.setItem('briefing_bookmarks', JSON.stringify(bookmarks)); }catch(e){}
}
function toggleBookmark(id, dateStr, categoryName, item){
  const idx = bookmarks.findIndex(b => b.id === id);
  if(idx >= 0){
    bookmarks.splice(idx, 1);
  } else {
    bookmarks.push({
      id, date: dateStr, category: categoryName,
      headline: item.headline, summary: item.summary,
      source: item.source, url: item.url, hrComment: item.hrComment || '',
      savedAt: Date.now()
    });
  }
  saveBookmarks();
  if(currentBriefing) renderBriefing(currentBriefing);
  renderBookmarkList();
}

// ---------- 드로어(사이드바) 열고 닫기 ----------

function openSidebar(){
  document.getElementById('sidebarDrawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar(){
  document.getElementById('sidebarDrawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function openBookmarks(){
  renderBookmarkList();
  document.getElementById('bookmarkDrawer').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeBookmarks(){
  document.getElementById('bookmarkDrawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function closeAllDrawers(){
  closeSidebar();
  closeBookmarks();
}

document.getElementById('sidebarBtn').onclick = () => { closeBookmarks(); openSidebar(); };
document.getElementById('bookmarkBtn').onclick = () => { closeSidebar(); openBookmarks(); };
